<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Sculptor - Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0D0823;
            color: #D46340;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .logo {
            width: 200px;
            height: auto;
            margin-bottom: 30px;
            max-width: 80%;
        }

        .tagline {
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 40px;
            font-weight: 300;
            opacity: 0.9;
        }

        .download-section {
            margin-bottom: 30px;
        }

        .download-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .download-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .download-btn {
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            opacity: 0.8;
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .store-icon {
            height: 60px;
            width: auto;
        }

        @media (max-width: 480px) {
            .logo {
                width: 160px;
                margin-bottom: 25px;
            }

            .tagline {
                font-size: 16px;
                margin-bottom: 35px;
            }

            .download-title {
                font-size: 22px;
                margin-bottom: 25px;
            }

            .store-icon {
                height: 50px;
            }
        }

        @media (max-width: 360px) {
            .container {
                padding: 0 10px;
            }

            .logo {
                width: 140px;
            }

            .tagline {
                font-size: 15px;
            }

            .store-icon {
                height: 45px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/fulllogo_transparent_nobuffer.png" alt="Job Sculptor Logo" class="logo">
        
        <p class="tagline">
            Simplify your job hunt—AI-powered tools to craft cover letters, prep interviews, track applications & more
        </p>

        <div class="download-section">
            <h1 class="download-title">Download Now</h1>
            
            <div class="download-buttons">
                <a href="https://apps.apple.com/in/app/job-sculptor-ai-job-tracker/id6746664002" 
                   class="download-btn" 
                   target="_blank" 
                   rel="noopener noreferrer">
                    <img src="images/appstore.svg" alt="Download on the App Store" class="store-icon">
                </a>

                <a href="https://play.google.com/store/apps/details?id=com.himanshukurapati.jobsculptor" 
                   class="download-btn" 
                   target="_blank" 
                   rel="noopener noreferrer">
                    <img src="images/playstore.png" alt="Get it on Google Play" class="store-icon">
                </a>
            </div>
        </div>
    </div>
</body>
</html>
